[tox]
minversion = 4.4.3
envlist = py{311,312,313,314}{,-notebook,-doctest}, lint, coverage, docs
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
# Qiskit 2.6.0 builds mimalloc with the initial-exec TLS model, which leaves too little of glibc's
# static TLS reserve for the libgomp that pyscf and qiskit-aer bundle ("cannot allocate memory in
# static TLS block").  Enlarge the reserve.  Harmless on non-glibc platforms, where the variable is
# ignored.  Remove once the minimum Qiskit version includes Qiskit/qiskit#17253 (expected in 2.6.1).
setenv =
  GLIBC_TUNABLES = glibc.rtld.optional_static_tls=524288
extras =
  !notebook: test
  doctest: doctest
  notebook: nbtest
  notebook: notebook-dependencies
commands =
  !notebook-!doctest: pytest {posargs}
  doctest: pytest --doctest-plus --doctest-only {posargs}
  notebook: pytest --nbmake --nbmake-timeout=3000 {posargs} docs/

[testenv:style]
extras =
  style
commands =
  ruff format qiskit_addon_slc/ docs/ tests/
  ruff check --fix qiskit_addon_slc/ docs/ tests/

[testenv:lint]
basepython = python3.11
extras =
  lint
commands =
  ruff format --check qiskit_addon_slc/ docs/ tests/
  ruff check qiskit_addon_slc/ docs/ tests/
  ruff check --preview --select CPY001 --exclude "*.ipynb" qiskit_addon_slc/ tests/
  mypy qiskit_addon_slc/
  pylint -rn qiskit_addon_slc/ tests/
  nbqa pylint -rn docs/
  typos
  reno lint

[testenv:coverage]
basepython = python3.11
deps =
  coverage>=7.4.1
extras =
  test
  doctest
commands =
  pytest --doctest-modules --cov=qiskit_addon_slc/

[testenv:docs]
basepython = python3.11
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/

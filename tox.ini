[tox]
minversion = 4.4.3
envlist = py{310,311,312,313,314}{,-notebook,-doctest}, lint, coverage, docs
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
extras =
  !notebook: test
  doctest: doctest
  notebook: nbtest
  notebook: notebook-dependencies
commands =
  !notebook-!doctest: pytest {posargs}
  doctest: pytest --doctest-plus --doctest-only {posargs}
  notebook: pytest --nbmake --nbmake-timeout=3000 {posargs} docs/

[testenv:style]
extras =
  style
commands =
  ruff format qiskit_addon_slc/ docs/ tests/
  ruff check --fix qiskit_addon_slc/ docs/ tests/

[testenv:lint]
basepython = python3.10
extras =
  lint
commands =
  ruff format --check qiskit_addon_slc/ docs/ tests/
  ruff check qiskit_addon_slc/ docs/ tests/
  ruff check --preview --select CPY001 --exclude "*.ipynb" qiskit_addon_slc/ tests/
  mypy qiskit_addon_slc/
  pylint -rn qiskit_addon_slc/ tests/
  nbqa pylint -rn docs/
  typos
  reno lint

[testenv:coverage]
basepython = python3.10
deps =
  coverage>=7.4.1
extras =
  test
  doctest
commands =
  pytest --doctest-modules --cov=qiskit_addon_slc/

[testenv:docs]
basepython = python3.10
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/

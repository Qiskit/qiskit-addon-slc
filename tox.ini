[tox]
minversion = 4.4.3
envlist = py{310,311,312,313,314}{,-notebook,-doctest}, lint, coverage, docs
isolated_build = True

[testenv]
# pytest imports the modules it collects doctests from by their path under `python/`, so they run
# against the source tree rather than an installed wheel; the editable install compiles the Rust
# extension into that tree.
package =
  !doctest: wheel
  doctest: editable
wheel_build_env = .pkg
parallel_show_output = True
extras =
  !notebook: test
  doctest: doctest
  notebook: nbtest
  notebook: notebook-dependencies
commands =
  !notebook-!doctest: pytest {posargs}
  doctest: pytest --doctest-plus --doctest-only {posargs}
  notebook: pytest --nbmake --nbmake-timeout=3000 {posargs} docs/

[testenv:style]
extras =
  style
commands =
  ruff format python/ docs/ tests/
  ruff check --fix python/ docs/ tests/

[testenv:lint]
basepython = python3.10
extras =
  lint
commands =
  ruff format --check python/ docs/ tests/
  ruff check python/ docs/ tests/
  ruff check --preview --select CPY001 --exclude "*.ipynb" python/ tests/
  mypy python/
  pylint -rn python/ tests/
  nbqa pylint -rn docs/
  typos
  reno lint

[testenv:coverage]
basepython = python3.10
# As for the doctests, and `--cov=python/` only measures code imported from the source tree.
package = editable
deps =
  coverage>=7.4.1
extras =
  test
  doctest
commands =
  pytest --doctest-modules --cov=python/

[testenv:docs]
basepython = python3.10
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/

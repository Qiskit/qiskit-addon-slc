[tox]
minversion = 4.4.3
envlist = py{310,311,312,313,314}{,-notebook,-doctest,-optional}, lint, coverage, docs
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
extras =
  test
commands =
  pytest {posargs}

# The default environment above deliberately installs none of the optional dependencies, which is
# what proves that every test needing one is guarded.  This is the complement: it installs them all
# and selects exactly the tests those guards skip.  See the "Optional dependencies" section of
# tests/README.md.
[testenv:{,py-,py3-,py310-,py311-,py312-,py313-,py314-}optional]
extras =
  test
  all
commands =
  pytest -m skipif {posargs}

[testenv:style]
extras =
  style
commands =
  ruff format qiskit_addon_slc/ docs/ tests/
  ruff check --fix qiskit_addon_slc/ docs/ tests/

[testenv:lint]
basepython = python3.10
extras =
  lint
  all
commands =
  ruff format --check qiskit_addon_slc/ docs/ tests/
  ruff check qiskit_addon_slc/ docs/ tests/
  ruff check --preview --select CPY001 --exclude "*.ipynb" qiskit_addon_slc/ tests/
  mypy qiskit_addon_slc/
  pylint -rn qiskit_addon_slc/ tests/
  nbqa pylint -rn docs/
  typos
  reno lint

[testenv:{,py-,py3-,py310-,py311-,py312-,py313-,py314-}notebook]
extras =
  nbtest
  notebook-dependencies
commands =
  pytest --nbmake --nbmake-timeout=3000 {posargs} docs/

[testenv:{,py-,py3-,py310-,py311-,py312-,py313-,py314-}doctest]
extras =
  test
  doctest
commands =
  pytest --doctest-plus --doctest-only {posargs}

[testenv:coverage]
basepython = python3.10
deps =
  coverage>=7.4.1
extras =
  test
  doctest
  all
commands =
  pytest --doctest-modules --cov=qiskit_addon_slc/

[testenv:docs]
basepython = python3.10
extras =
  docs
commands =
  sphinx-build -j auto -W -T --keep-going -b html {posargs} {toxinidir}/docs/ {toxinidir}/docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/

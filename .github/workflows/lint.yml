---
name: Lint

# This is a reusable workflow, driven by `branch-protection.yml`.  It deliberately has no `push` or
# `pull_request` triggers of its own, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true
      python-version:
        description: >
          Python version to use.  Must match the `basepython` of the `lint` environment in `tox.ini`.
        type: string
        required: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s extras), so the pip wheel
          # cache is keyed on that file.  Coarser than a lockfile: any edit to it, dependency-related or
          # not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run lint check
        run: |
          tox -e lint

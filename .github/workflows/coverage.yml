name: Coverage

# This is deliberately *not* part of `branch-protection.yml`:
#
# * it needs the `push` trigger to give Coveralls a datapoint for every commit, which a
#   `workflow_call`-only workflow cannot do; and
# * coverage is a metric rather than a correctness property, so a coveralls.io outage should not be
#   able to block merging.

on:
  push:
    branches:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Even though this workflow isn't part of branch protection, it still reads its Python version and
  # runner image from the shared configuration so they don't have to be kept in step by hand.
  config:
    name: Configure
    if: github.repository_owner == 'Qiskit'
    uses: ./.github/workflows/config.yml

  coverage:
    name: Coverage
    needs: config
    runs-on: ${{ needs.config.outputs.runner-linux-x86_64 }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          # Must match the `basepython` of the `coverage` environment in `tox.ini`.
          python-version: ${{ needs.config.outputs.python-coverage }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s extras), so the pip wheel
          # cache is keyed on that file.  Coarser than a lockfile: any edit to it, dependency-related or
          # not, invalidates the cache.
          #
          # Because this workflow runs on `push`, it is also what writes this cache to the base
          # branch's scope, where pull requests can read it.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox coverage

      - name: Run coverage
        run: |
          tox -e coverage

      - name: Convert to lcov
        if: always()
        run: coverage3 lcov -o coveralls.lcov

      - name: Upload report to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coveralls.lcov
          format: lcov

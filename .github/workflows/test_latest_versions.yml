---
name: Latest version tests

# This is a reusable workflow, driven by `branch-protection.yml` (for pull requests and the merge
# queue) and by `on-nightly.yml` (for the scheduled run).  It deliberately has no triggers of its own
# beyond `workflow_call`, and no `concurrency` block: the calling workflow owns both.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true
      python-version:
        description: Python version to test.
        type: string
        required: true

jobs:
  tests:
    # The caller's job name carries the matrix values, which GitHub appends to it, so this only needs
    # to say which suite is running.
    name: latest
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s extras), so the pip wheel
          # cache is keyed on that file.  Coarser than a lockfile: any edit to it, dependency-related or
          # not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      # `Cargo.lock` is committed and pins every dependency to crates.io, so it fully describes what
      # gets downloaded.  Deliberately the registry only, not `target/`: the extension is rebuilt in
      # release mode with LTO from a fresh checkout on every run, so its artifacts would need a key on
      # every source change.  `restore-keys` is safe here because the registry is content-addressed --
      # a partial restore is just a warm subset that cargo completes and checksums.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }}

      # The package is a maturin-built PyO3 extension, so every tox environment compiles it.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Test using tox environment
        shell: bash
        run: |
          tox -e py --parallel --parallel-no-spinner

      - name: Run doctests
        shell: bash
        run: |
          tox -e py-doctest

      - name: Run notebook tests
        shell: bash
        run: |
          tox -e py-notebook

---
name: Sphinx

# This is a reusable workflow and the single source of truth for building the documentation.  It
# deliberately has no `push` or `pull_request` triggers of its own, and no `concurrency` block: the
# calling workflow owns both.
#
# It only ever *builds*.  Publishing to GitHub Pages is a separate concern, handled by
# `docs_deploy.yml`, which consumes the `qiskit-addon-slc-htmldocs` artifact produced below.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.  Expects an Ubuntu image (we install `pandoc` via apt).
        type: string
        required: true
      python-version:
        description: >
          Python version to use.  Must match the `basepython` of the `docs` environment in `tox.ini`.
        type: string
        required: true

jobs:
  build:
    name: Docs
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ inputs.python-version }}
          # There is no lockfile (dependencies come from `pyproject.toml`'s extras), so the pip wheel
          # cache is keyed on that file.  Coarser than a lockfile: any edit to it, dependency-related or
          # not, invalidates the cache.
          cache: pip
          cache-dependency-path: pyproject.toml

      # `Cargo.lock` is committed and pins every dependency to crates.io, so it fully describes what
      # gets downloaded.  Deliberately the registry only, not `target/`: the extension is rebuilt in
      # release mode with LTO from a fresh checkout on every run, so its artifacts would need a key on
      # every source change.  `restore-keys` is safe here because the registry is content-addressed --
      # a partial restore is just a warm subset that cargo completes and checksums.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }} | ${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1 | ${{ runner.os }} | ${{ runner.arch }}

      # The package is a maturin-built PyO3 extension, so every tox environment compiles it.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Tell reno to name the upcoming release after the branch we are on
        shell: bash
        run: |
          sed -i.bak -e '/unreleased_version_title:*/d' releasenotes/config.yaml
          echo unreleased_version_title: \"Upcoming release \(\`\`${GITHUB_REF_NAME}\`\`\)\" >> releasenotes/config.yaml

      - name: Build docs
        run: |
          tox -e docs

      # Provide a nicely named artifact that extracts into an
      # identically named subdirectory.
      - name: Prepare nice docs artifact for humans
        if: always()
        shell: bash
        run: |
          mkdir artifact
          cp -a docs/_build/html artifact/qiskit-addon-slc-htmldocs

      - name: Upload nice docs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qiskit-addon-slc-htmldocs
          path: ./artifact

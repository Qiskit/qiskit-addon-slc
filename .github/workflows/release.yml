name: Deploy release artifacts
on:
  push:
    # Deliberately restrictive: a push to this workflow's trigger publishes to PyPI, which is
    # irrevocable.  Only version-shaped tags qualify, so a stray or mistyped tag (`v0.1.0`, `test`,
    # a documentation marker) cannot start a release.  Same filter as `docs_deploy.yml`; the
    # trailing `*` admits pre-release suffixes such as `0.1.0rc1`.
    #
    # There is deliberately no `workflow_dispatch` either: a manual run from a branch would publish
    # whatever that branch contains to PyPI.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  config:
    name: Configure
    uses: ./.github/workflows/config.yml

  # The distributions are built exactly once, so that what is attached to the GitHub release is
  # byte-for-byte what is uploaded to PyPI.
  build:
    name: Build distributions
    needs: config
    runs-on: ${{ needs.config.outputs.runner-linux-x86_64 }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: ${{ needs.config.outputs.python-new }}
      - name: Build sdist and wheel
        run: |
          set -e
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          path: ./dist/*
          name: deploy-dist

  github:
    name: Publish to GitHub
    runs-on: ubuntu-latest
    needs:
      - build
    # Creating a release needs write access to repository contents.  This currently also works without
    # the block (the repository's default workflow token is read/write), but stating it explicitly
    # keeps the job working if that default is ever tightened to read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: deploy
          merge-multiple: true
      # We must set `prerelease` explicitly rather than let the action infer it.  Its automatic
      # detection uses SemVer rules, under which every `0.x` version is "unstable" -- so a plain
      # `0.1.0` would be published as a pre-release.  It also would not recognise our PEP 440
      # spelling of a pre-release (`0.1.0rc1`, no hyphen) as unstable in the first place.  So derive
      # the flag from the tag: a trailing non-numeric suffix (`a`/`b`/`rc`) means pre-release, and a
      # bare `X.Y.Z` means stable.
      - name: Determine release stability from the tag
        id: stability
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "Tag '$TAG' -> prerelease=$prerelease"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: ghalactic/github-release-from-tag@v6
        with:
          prerelease: ${{ steps.stability.outputs.prerelease }}
          generateReleaseNotes: "true"
          assets: |
            - path: deploy/*

  pypi:
    name: Publish to pypi
    runs-on: ubuntu-latest
    needs:
      - build
      - github
    environment:
      name: pypi
      url: https://pypi.org/p/qiskit-addon-slc
    permissions:
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: deploy
          merge-multiple: true
      # `release/v1` is a mutable branch rather than a tag, so we silently pick up upstream changes
      # (and Dependabot will not bump it).  That is deliberate and is what upstream recommends for
      # this action: trusted publishing has to track PyPI's OIDC flow, and a stale pin would fail at
      # release time rather than in CI.
      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: deploy

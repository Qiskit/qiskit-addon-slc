[package]
name = "qiskit_addon_slc_accelerate"
description = "Rust accelerator for qiskit-addon-slc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
name = "_accelerate"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"
num-complex = "0.4"
nalgebra = "0.35"

[profile.release]
opt-level = 3
lto = true

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "qiskit-addon-slc"
version = "0.1.0"
readme = "README.md"
description = "Reducing PEC sampling overhead with shaded lightcones"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.10.5, <4",
    "plotly>=6.5.0, <8",
    "qiskit[visualization]>=2.2, <3",
    "pauli-prop>=0.1.0, <1",
    "rustworkx",
    "samplomatic>=0.16.0"
]

[project.optional-dependencies]
dev = [
    "qiskit-addon-slc[test,doctest,nbtest,lint,docs]",
    "tox>=4.4.3",
]
basetest = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-subtests>=0.14",
]
test = [
    "qiskit-addon-slc[basetest]",
    "qiskit-ibm-runtime>=0.47",
]
doctest = [
    "qiskit-addon-slc[basetest,notebook-dependencies]",
    "pytest-doctestplus>=1.3.0",
]
nbtest = [
    "qiskit-addon-slc[basetest]",
    "nbmake>=1.5.0",
]
style = [
    "ruff==0.16.10",
    "nbqa>=1.8.5",
    "typos>=1.20.0",
]
lint = [
    "qiskit-addon-slc[style]",
    "mypy==2.4.0",
    "pylint==4.1.2",
    "reno>=4.1",
    "toml>=0.9.6",
]
notebook-dependencies = [
    "qiskit-addon-slc",
    "qiskit-addon-utils>=0.3.0",
    "qiskit-ibm-runtime>=0.47",
]
docs = [
    "qiskit-addon-slc[doctest]",
    "qiskit-sphinx-theme~=2.1.0",
    "jupyter-sphinx",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx_reredirects",
    "nbsphinx>=0.9.4",
    "reno>=4.1",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.maturin]
bindings = "pyo3"
python-source = "python"
features = ["pyo3/extension-module"]
locked = true
profile = "release"
module-name = "qiskit_addon_slc._accelerate"

# The extension is built abi3 (`pyo3`'s `abi3-py311` feature in `Cargo.toml`), so cibuildwheel
# collapses each platform down to a single `cp311-abi3` wheel, which it then tests under every
# supported Python.
[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build = ["cp3??-*"]
skip = [
    "cp315-*",  # not yet supported
    "*-win32",
    "*_i686",
    "*_universal2",
    "*-musllinux_*",
]
test-extras = ["test"]
# `qiskit-aer` (required by `pauli-prop`) publishes no CPython 3.14 wheel for Linux aarch64 (latest
# 0.17.2), and building it from source fails in the manylinux container for lack of BLAS. This only
# skips *testing* there: the wheel is the same `cp311-abi3` one that is tested on 3.11-3.13. Drop
# this once a `qiskit-aer` release ships `cp314-manylinux_*_aarch64` wheels.
test-skip = ["cp314-manylinux_aarch64"]
# Passing the test path explicitly makes pytest ignore `[tool.pytest.ini_options].testpaths`, so the
# doctests under `python/qiskit_addon_slc/` are not collected (`-p no:doctest`): they need the
# source tree, and stay owned by `test_latest_versions.yml`. `{project}` qualifies the path because
# cibuildwheel runs the test command from its own scratch directory.
test-command = "python -m pytest -p no:doctest {project}/tests"
environment = 'RUSTUP_TOOLCHAIN="stable"'

[tool.cibuildwheel.linux]
# The manylinux containers do not have Rust.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
environment = 'PATH="$PATH:$HOME/.cargo/bin" CARGO_NET_GIT_FETCH_WITH_CLI="true" RUSTUP_TOOLCHAIN="stable"'
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} && pipx run abi3audit --strict --report {wheel}"

[tool.cibuildwheel.macos]
# A single floor for both architectures: `rustc` raises it to 11.0 for `aarch64-apple-darwin` on its
# own, and 10.12 is `rustc`'s own default for `x86_64-apple-darwin`.
environment = "MACOSX_DEPLOYMENT_TARGET='10.12' RUSTUP_TOOLCHAIN=stable"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} && pipx run abi3audit --strict --report {wheel}"

[tool.cibuildwheel.windows]
repair-wheel-command = "python -c \"import shutil, sys; shutil.copy(sys.argv[1], sys.argv[2])\" {wheel} {dest_dir} && pipx run abi3audit --strict --report {wheel}"

[tool.mypy]
# Deliberately ahead of requires-python.  numpy's stubs use PEP 695 "type"
# statements, which mypy rejects unless it is analyzing as 3.12 or later.
python_version = "3.12"
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.11"
ignore-patterns = [".*\\.pyi"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
    "reimported",
    "no-else-raise",
    "redefined-argument-from-local",
    "redefined-builtin",
    "raise-missing-from",
    "cyclic-import",
    "unused-argument",
    "attribute-defined-outside-init",
    "no-else-return",
]

[tool.pytest.ini_options]
testpaths = ["./python/qiskit_addon_slc/", "./tests/"]

[tool.ruff]
line-length = 100
src = ["python/qiskit_addon_slc", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "D",   # pydocstyle
    "F",   # pyflakes
    "RUF", # ruff
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.extend-per-file-ignores]
"tests/**.py" = [
    "D",  # pydocstyle
]
"docs/**/*" = [
    "E402", # module level import not at top of file
    "D",    # pydocstyle
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = """
# This code is a Qiskit project.
#
# \\(C\\) Copyright IBM \\d{4}((,\\s)\\d{4})*\\.
#
# This code is licensed under the Apache License, Version 2\\.0\\. You may
# obtain a copy of this license in the LICENSE\\.txt file in the root directory
# of this source tree or at http\\:\\/\\/www\\.apache\\.org\\/licenses\\/LICENSE\\-2\\.0\\.
#
# Any modifications or derivative works of this code must retain this
# copyright notice, and modified files need to carry a notice indicating
# that they have been altered from the originals\\.
"""

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.typos.default.extend-words]
aer = "aer"
arange = "arange"
CPY = "CPY"
IZ = "IZ"  # Pauli string, not a typo of "IS"

---
fixes:
  - |
    Fixed :func:`~qiskit_addon_slc.bounds.compute_local_scales` raising an ``IndexError`` when no
    error term gets selected for mitigation. This is reachable through each of the three conditions
    making up the selection: a ``sampling_cost_budget`` below the cost of even the cheapest term, a
    ``bias_tolerance`` already above the total bias bound, or a set of commutator bounds that are all
    zero. Mitigating nothing is now reported with a sampling cost overhead of ``1.0``, the value of
    not mitigating anything.
  - |
    Fixed the default value of the ``evolution_max_terms`` argument of
    :func:`~qiskit_addon_slc.bounds.time_evolved_norm_forward`, which aborted the process when the
    function was called without it. The underlying propagation routine treats the argument as a
    capacity to pre-allocate rather than as an upper limit, so the previous default of
    ``numpy.iinfo(numpy.uint).max`` requested an impossible amount of memory. It now matches the
    default of :func:`~qiskit_addon_slc.bounds.compute_forward_bounds`, which was already a realistic
    value and therefore unaffected.

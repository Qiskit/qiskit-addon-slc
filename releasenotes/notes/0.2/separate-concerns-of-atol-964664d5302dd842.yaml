---
deprecations:
  - |
    The ``atol`` argument to the
    :func:`~qiskit_addon_slc.bounds.compute_forward_bounds` function has been
    deprecated. Use the new ``atol_simplify`` and ``atol_eigenvalue`` arguments
    instead. ``atol_simplify`` keeps the previous default of ``1e-8``, whereas
    ``atol_eigenvalue`` defaults to ``1e-10``, since ``1e-8`` was occasionally
    producing significant inaccuracy in the eigenvalue computation.

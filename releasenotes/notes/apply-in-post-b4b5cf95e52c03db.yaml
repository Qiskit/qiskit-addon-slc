---
features:
  - |
    Added the ``apply_in_post`` argument to
    :func:`~qiskit_addon_slc.bounds.compute_local_scales`. Set this to ``True``
    when the experiment is run as standard PEC (i.e. Paulis are injected for all
    error terms) and SLC is applied to the resulting data in post-processing.
    This is necessary whenever the error terms to mitigate are not known at the
    time of the experiment, for example, when computing multiple observables
    from a single dataset, or when computing a single observable retroactively
    from existing PEC data. In that scenario, the minus signs associated with
    unmitigated low-priority errors are ignored, which effectively doubles their
    error rates. This setting accounts for that by prioritizing errors greedily
    based on their "value density" instead of using the default prioritization.

    When ``apply_in_post`` is ``True``, the returned ``local_scales`` must not be
    provided to the :class:`~samplomatic.samplex.Samplex`. Instead, they are used
    when processing the experiment's results.
